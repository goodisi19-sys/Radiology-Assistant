name: Build Windows app

on:
  push:
    branches: [ main, fix/library-audit-and-document-safety ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: windows-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  fast:
    runs-on: windows-latest
    timeout-minutes: 8
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Quick formatting and slot contracts
        run: python -m unittest -v test_slot_phrases test_report_format

  build:
    # This branch already builds on push; do not duplicate its ZIP on PR events.
    needs: fast
    timeout-minutes: 55
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
    permissions:
      contents: write
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Verify and extract bundled INT8 models
        run: python tools/prepare_hybrid_models.py
      - name: Restore source-verified conversion cache
        run: python prepare_catalog.py
      - name: Verify bundled MRI protocol catalog
        shell: pwsh
        run: |
          if (!(Test-Path protocols.json.br.b64)) { throw "Missing de-identified MRI protocol catalog" }
      - name: Verify MRI catalog and Python source
        run: python check_catalog.py
      - name: Full test suite with timeout diagnostics
        timeout-minutes: 32
        run: python tools/run_full_tests.py
      - name: Build isolated console inference worker
        run: pyinstaller --noconfirm --clean --onedir --console --hidden-import onnxruntime.capi.onnxruntime_pybind11_state --hidden-import tokenizers.tokenizers --copy-metadata onnxruntime --copy-metadata tokenizers --name RadiologyNeuralWorker hybrid_worker.py
      - name: Install external model assets beside executable
        shell: pwsh
        run: |
          Copy-Item models dist/models -Recurse
          Copy-Item model-lock.json dist/
      - name: Probe compiled neural worker
        run: python tools/probe_worker.py dist
      - name: Measure local module performance
        run: python benchmark_ai.py
      - name: Benchmark held-out medical ranking and resource policy
        run: |
          python benchmark_hybrid.py
          python benchmark_hybrid_gui.py
          python benchmark_context.py
      - name: Audit actual imported MRI library
        run: python audit_library.py
      - name: Audit paragraph layout of all 497 protocols
        run: python audit_layouts.py
      - name: Build portable executable
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed --hidden-import onnxruntime.capi.onnxruntime_pybind11_state --hidden-import tokenizers.tokenizers --copy-metadata onnxruntime --copy-metadata tokenizers --add-data "protocols.json.br.b64;." --add-data "quick_lines.json;." --add-data "protocols_extra.json;." --add-data "protocols_legacy.json;." --add-data "protocol_sources.json;." --add-data "protocol_source_map.json;." --add-data "drive_odt_01.json;." --add-data "drive_odt_02.json;." --add-data "drive_odt_03.json;." --add-data "drive_odt_04.json;." --add-data "drive_odt_05.json;." --add-data "drive_odt_06.json;." --add-data "drive_odt_07.json;." --add-data "drive_odt_08.json;." --add-data "drive_odt_09.json;." --add-data "drive_odt_10.json;." --add-data "drive_odt_11.json;." --add-data "drive_odt_12.json;." --add-data "drive_odt_13.json;." --add-data "drive_odt_14.json;." --add-data "drive_odt_15.json;." --add-data "drive_odt_16.json;." --add-data "drive_odt_17.json;." --add-data "drive_odt_18.json;." --add-data "spelling_data;spelling_data" --name RadiologyAssistant app.py
      - name: Test packaged Windows executable
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          $result = Join-Path $PWD "exe-smoke.json"
          $process = Start-Process dist/RadiologyAssistant.exe -ArgumentList "--smoke-test", "`"$result`"" -PassThru
          if (!$process.WaitForExit(120000)) { $process.Kill(); throw "EXE smoke test timed out" }
          if ($process.ExitCode -ne 0 -or !(Test-Path $result)) {
            if (Test-Path "$result.error.txt") { Get-Content "$result.error.txt" }
            throw "EXE smoke test failed"
          }
          Get-Content $result
      - name: Test packaged default-browser dispatcher without network
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          $result = Join-Path $PWD "browser-smoke.json"
          $process = Start-Process dist/RadiologyAssistant.exe -ArgumentList "--browser-smoke-test", "`"$result`"" -PassThru
          if (!$process.WaitForExit(30000)) { $process.Kill(); throw "Browser smoke test timed out" }
          if ($process.ExitCode -ne 0 -or !(Test-Path $result)) {
            if (Test-Path "$result.error.txt") { Get-Content "$result.error.txt" }
            throw "Default-browser dispatcher test failed"
          }
          Get-Content $result
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path package | Out-Null
          Copy-Item dist/RadiologyAssistant.exe package/
          Copy-Item dist/models package/models -Recurse
          Copy-Item dist/RadiologyNeuralWorker package/RadiologyNeuralWorker -Recurse
          Copy-Item model-lock.json package/
          Copy-Item HYBRID_AI_AUDIT.md package/
          Copy-Item RAD_CONTEXT_UPDATE.md package/
          Copy-Item RAD_REFINEMENTS_2026-11-23.md package/
          Copy-Item CLAUDE_AUDIT_2026-11-23.md package/
          Copy-Item RAD_BROWSER_AND_AI_VALUE_2026-11-23.md package/
          Copy-Item reports/neural-word-value.json package/
          Copy-Item reports/neural-retrieval-value.json package/
          Copy-Item reports/claude-audit-checks.json package/
          Copy-Item reports/refinement-comparison.json package/
          Copy-Item reports/context-retrieval.json package/
          Copy-Item reports/sage-decoder-experiment.json package/
          Copy-Item browser-smoke.json package/
          Copy-Item hybrid-benchmark.json package/
          Copy-Item hybrid-gui-benchmark.json package/
          Copy-Item USER_GUIDE.md package/
          Copy-Item spelling_data/README_ru_RU.txt package/СЛОВАРЬ-ЛИЦЕНЗИЯ.txt
          Copy-Item spelling_data/LICENSE-spylls.txt package/
          @"
          Radiology Assistant
          Запустите RadiologyAssistant.exe.
          Библиотека МРТ с протоколами и фразами загружается локально при первом запуске.
          Для импорта используйте меню Библиотека → Импорт шаблонов.
          "@ | Set-Content package/ИНСТРУКЦИЯ.txt -Encoding UTF8
          Copy-Item layout-audit.json package/
          Copy-Item exe-smoke.json package/
          if (Test-Path BENCHMARK_GEMMA4.md) { Copy-Item BENCHMARK_GEMMA4.md package/ }
          Copy-Item performance-results.json package/
          python package_licenses.py
          Compress-Archive -Path package/* -DestinationPath RadiologyAssistant-HybridAI-run${{ github.run_id }}.zip
      - name: Upload build artifact
        id: artifact
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: RadiologyAssistant-Windows
          path: RadiologyAssistant-HybridAI-run${{ github.run_id }}.zip
          retention-days: 7
          if-no-files-found: error

      - name: Publish checked Windows ZIP
        if: success() && !startsWith(github.ref_name, 'experiment/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "hybridai-run${{ github.run_id }}"
          gh release create $tag "RadiologyAssistant-HybridAI-run${{ github.run_id }}.zip" --target "${{ github.sha }}" --prerelease --title "Radiology Assistant HybridAI run ${{ github.run_id }}" --notes "Windows EXE passed packaged smoke tests. Published from the verified workflow run."
          if ($LASTEXITCODE -ne 0) { throw "ZIP publication failed" }
      - name: Require a downloadable build
        if: steps.artifact.outcome == 'failure' && startsWith(github.ref_name, 'experiment/')
        run: throw "Experimental artifact upload failed"
