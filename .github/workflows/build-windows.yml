name: Build Windows app

on:
  push:
    branches: [ main, fix/library-audit-and-document-safety ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    # This branch already builds on push; do not duplicate its ZIP on PR events.
    if: github.event_name != 'pull_request' || github.head_ref != 'fix/library-audit-and-document-safety'
    runs-on: windows-latest
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
    permissions:
      contents: write
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Verify and extract bundled INT8 models
        run: python tools/prepare_hybrid_models.py
      - name: Restore source-verified conversion cache
        run: python prepare_catalog.py
      - name: Verify bundled MRI protocol catalog
        shell: pwsh
        run: |
          if (!(Test-Path protocols.json.br.b64)) { throw "Missing de-identified MRI protocol catalog" }
      - name: Verify MRI catalog and Python source
        run: python check_catalog.py
      - name: Test automatic report formatting
        run: python -m unittest discover -v
      - name: Measure local module performance
        run: python benchmark_ai.py
      - name: Benchmark held-out medical ranking and resource policy
        run: |
          python benchmark_hybrid.py
          python benchmark_hybrid_gui.py
      - name: Audit actual imported MRI library
        run: python audit_library.py
      - name: Audit paragraph layout of all 497 protocols
        run: python audit_layouts.py
      - name: Build portable executable
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed --add-data "protocols.json.br.b64;." --add-data "quick_lines.json;." --add-data "protocols_extra.json;." --add-data "protocols_legacy.json;." --add-data "protocol_sources.json;." --add-data "protocol_source_map.json;." --add-data "drive_odt_01.json;." --add-data "drive_odt_02.json;." --add-data "drive_odt_03.json;." --add-data "drive_odt_04.json;." --add-data "drive_odt_05.json;." --add-data "drive_odt_06.json;." --add-data "drive_odt_07.json;." --add-data "drive_odt_08.json;." --add-data "drive_odt_09.json;." --add-data "drive_odt_10.json;." --add-data "drive_odt_11.json;." --add-data "drive_odt_12.json;." --add-data "drive_odt_13.json;." --add-data "drive_odt_14.json;." --add-data "drive_odt_15.json;." --add-data "drive_odt_16.json;." --add-data "drive_odt_17.json;." --add-data "drive_odt_18.json;." --add-data "spelling_data;spelling_data" --name RadiologyAssistant app.py
      - name: Build isolated console inference worker
        run: pyinstaller --noconfirm --clean --onedir --console --name RadiologyNeuralWorker hybrid_worker.py
      - name: Install external model assets beside executable
        shell: pwsh
        run: |
          Copy-Item models dist/models -Recurse
          Copy-Item model-lock.json dist/
      - name: Test packaged Windows executable
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          $result = Join-Path $PWD "exe-smoke.json"
          $process = Start-Process dist/RadiologyAssistant.exe -ArgumentList "--smoke-test", "`"$result`"" -PassThru
          if (!$process.WaitForExit(120000)) { $process.Kill(); throw "EXE smoke test timed out" }
          if ($process.ExitCode -ne 0 -or !(Test-Path $result)) {
            if (Test-Path "$result.error.txt") { Get-Content "$result.error.txt" }
            throw "EXE smoke test failed"
          }
          Get-Content $result
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path package | Out-Null
          Copy-Item dist/RadiologyAssistant.exe package/
          Copy-Item dist/models package/models -Recurse
          Copy-Item dist/RadiologyNeuralWorker package/RadiologyNeuralWorker -Recurse
          Copy-Item model-lock.json package/
          Copy-Item HYBRID_AI_AUDIT.md package/
          Copy-Item hybrid-benchmark.json package/
          Copy-Item hybrid-gui-benchmark.json package/
          Copy-Item USER_GUIDE.md package/
          Copy-Item spelling_data/README_ru_RU.txt package/СЛОВАРЬ-ЛИЦЕНЗИЯ.txt
          Copy-Item spelling_data/LICENSE-spylls.txt package/
          @"
          Radiology Assistant
          Запустите RadiologyAssistant.exe.
          Библиотека МРТ с протоколами и фразами загружается локально при первом запуске.
          Для импорта используйте меню Библиотека → Импорт шаблонов.
          "@ | Set-Content package/ИНСТРУКЦИЯ.txt -Encoding UTF8
          Copy-Item layout-audit.json package/
          Copy-Item exe-smoke.json package/
          Copy-Item performance-results.json package/
          python package_licenses.py
          Compress-Archive -Path package/* -DestinationPath RadiologyAssistant-HybridAI-run${{ github.run_id }}.zip
      - name: Upload build artifact
        id: artifact
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: RadiologyAssistant-Windows
          path: RadiologyAssistant-HybridAI-run${{ github.run_id }}.zip
          retention-days: 7
          if-no-files-found: error

      - name: Publish ZIP fallback if Actions artifact quota is exhausted
        if: steps.artifact.outcome == 'failure' && github.event_name != 'pull_request'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "hybridai-run${{ github.run_id }}"
          gh release create $tag "RadiologyAssistant-HybridAI-run${{ github.run_id }}.zip" --target "${{ github.sha }}" --prerelease --title "Radiology Assistant HybridAI run ${{ github.run_id }}" --notes "Windows EXE passed packaged smoke tests. Actions storage quota prevented artifact upload; this new release preserves previous builds."
          if ($LASTEXITCODE -ne 0) { throw "ZIP publication failed" }
      - name: Require a downloadable build
        if: steps.artifact.outcome == 'failure' && github.event_name == 'pull_request'
        run: throw "Actions artifact upload failed; dispatch this branch workflow to publish a release fallback"
